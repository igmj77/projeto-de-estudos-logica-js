<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Meu Primeiro Programa.</title>
    <style>
        body {
            background-color: #3b7fa7;
            font-family: Arial, sans-serif;
            font: normal 16pt Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            color: #ffffff;
        }
        p {
            color: #ffffff;
        }
            h4 {
                color: #ffffff;
            }
    </style>
</head>
<body>
    <h1>Meu Primeiro Programa.</h1>
    <p>Olá, Mundo!</p>
    <h4>Já me livrei da dependência!</h4>
    <p>Agora posso criar meus programas sem precisar de um ambiente de desenvolvimento.</p>
    <script>
        window.alert("Minha primeira mensagem de alerta!"); // Esta linha irá exibir uma caixa de alerta com a mensagem "Minha primeira mensagem de alerta!".   
        window.confirm("Está gostando de aprender JavaScript?"); // Esta linha irá exibir uma caixa de confirmação, ok oe Cancele, mas o valor retornado (true ou false) não será armazenado ou usado posteriormente.
        window.prompt("Qual é o seu nome?"); // Esta linha irá solicitar ao usuário que insira seu nome, mas o valor não será armazenado ou usado posteriormente.
    </script>
</body>
</html>
