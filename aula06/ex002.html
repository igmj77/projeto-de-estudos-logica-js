<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Meu Primeiro Programa.</title>
    <style>
        body {
            /* Este é um Comentário em CSS */            background-color: #3b7fa7;
            font-family: Arial, sans-serif;
            font: normal 16pt Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            color: #ffffff;
        }
        p {
            color: #ffffff;
        }
            h4 {
                color: #ffffff;
            }
    </style>
</head>
<body>
    <h1>Meu Primeiro Programa.</h1> <!-- Este é um comentário em HTML -->
    <p>Olá, Mundo!</p>
    <h4>Já me livrei da dependência!</h4>
    <p>Agora posso criar meus programas sem precisar de um ambiente de desenvolvimento.</p>
    <script>
        var nome = window.prompt("Qual é o seu nome?"); // Esta linha irá solicitar ao usuário que insira seu nome, e o valor será armazenado na variável 'nome'.
        window.alert("Olá, " + nome + "! Bem-vindo ao mundo da programação!"); // Esta linha irá exibir uma mensagem de boas-vindas personalizada usando o nome fornecido pelo usuário.
    </script>
</body>
</html>
