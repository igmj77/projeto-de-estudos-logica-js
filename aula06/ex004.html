<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nomes - Maiusculos & Minusculos</title>
    <style>
        body {
            font: normal 20px Arial;
            color: #116ed8d7;
            background-color: #d8e9f7;
            text-align: center;
        }
    </style>
</head>
<body>
    <script>
       var nome = window.prompt('Qual é o seu nome?');
    
    // Verifica se o usuário não cancelou o prompt

    if (nome) {
      document.write(`Olá, <strong>${nome}</strong>! Seu nome tem ${nome.length} letras.<br>`);
      document.write(`Seu nome em maiúsculas é: <strong>${nome.toUpperCase()}</strong><br>`);
      document.write(`Seu nome em minúsculas é: <strong>${nome.toLowerCase()}</strong><br>`);
    } 
       
    else {
      document.write('Você não digitou um nome.');
    }
    
    </script>
</body>
</html>
