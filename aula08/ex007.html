<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Eventos DOM</title>
    <style>
        div#area {
            width: 200px;
            height: 200px;
            background: rgb(127, 180, 127);
            color: white;
            font: normal 20px Arial;
            line-height: 200px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="area" onclick="clicar()" onmouseover="this.style.background='rgb(127, 127, 180)'" onmouseout="this.style.background='rgb(127, 180, 127)'"> 
        Interaja comigo!
    </div>
    <script>
        function clicar() {
            let area = window.document.getElementById('area')
            area.innerText = 'Clicou!'
            area.style.background = 'rgb(180, 127, 127)'
        }
    </script>
</body>
</html>
