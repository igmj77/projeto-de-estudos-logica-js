<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detran</title>
</head>
<body>
    <h1>Sistema de Multas</h1>
    velocidade do Automóvel: <input type="number" name="txtvel" id="txtvel">
    <input type="button" value="verificar" onclick="calcular()">
    <div id="res">
    </div>
    <script>
        function calcular() {
            let txtv = window.document.querySelector('input#txtvel')
            let res = window.document.querySelector('div#res')
            let vel = Number(txtv.value)
            if (vel > 40) {
                res.innerHTML = `<p>Sua velocidade atual é de <strong>${vel} km/h</strong>. <br>Você ultrapassou o Limite de Velocidade. <strong>Multa de R$:132,58</strong></p>`
                if (vel > 40) {
                    res.innerHTML += `<p>Você foi multado por excesso de velocidade.<p/>`
                }
                res.innerHTML += `<p>Dirija sempre usando cinto de segurança!</P>`
            }
        }
    </script>
</body>
</html>
