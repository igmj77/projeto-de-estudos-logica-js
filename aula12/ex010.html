<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passa Porte</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #ebc9ad;
        }
        input {
            font-size: 1em;
            margin: 5px;
            width: 150px;
            text-align: center;
            border: 2px solid #123456;
            border-radius: 5px;
            background-color: #e9e782;
        }
        div#res {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Sistema para Estrangeiros</h1>
    Nacionalidade: <input type="text" name="txtnac" id="txtnac">
    <input type="button" value="verificar" onclick="verificar()">
    <div 
        id="res">
    </div>
    <script>
        function verificar() {
            let txtnac = window.document.querySelector('input#txtnac')
            let res = window.document.querySelector('div#res')
            let nacionalidade = txtnac.value

            if (nacionalidade === "Brasileiro") {
                res.innerHTML = `<p>Você é <strong>Brasileiro(a)</strong>. <br>Parabéns!</p>`
            } else {
                res.innerHTML = `<p>Você é <strong>Estrangeiro(a)</strong>. <br>Verifique seus documentos.</p>`
            }
        }
    </script> 
</body>
</html>
